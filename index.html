<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111f">
<title>DODGE READ｜消えたボール</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0;background:#070b13;color:#fff;min-height:100svh;overflow:hidden}button{font:inherit}.screen{display:none;min-height:100svh}.screen.active{display:flex}.home,.result{align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:radial-gradient(circle at 50% 28%,#17345d 0,#0c1729 38%,#070b13 78%)}.brand{font-size:13px;letter-spacing:.22em;color:#8fd6ff;font-weight:800}.home h1,.result h1{font-size:clamp(34px,8vw,68px);margin:8px 0}.lead{color:#c9d5e8;margin:0 0 24px}.ball-logo{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff9af,#ffda36 44%,#e66d00 100%);box-shadow:0 24px 60px #0008;margin:8px 0 28px;position:relative}.ball-logo:before,.ball-logo:after{content:"";position:absolute;inset:17px;border:5px solid #71320088;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;transform:rotate(25deg)}.ball-logo:after{transform:rotate(205deg)}.primary,.secondary{border:0;border-radius:16px;padding:15px 24px;font-weight:800;cursor:pointer}.primary{background:#ffda36;color:#251800;min-width:230px;font-size:18px;box-shadow:0 10px 24px #0006}.secondary{margin-top:10px;background:#1b2b43;color:#dce8f8}.stats{display:flex;gap:30px;margin-top:28px}.stats span{display:block;color:#9fb1ca;font-size:12px}.stats strong{font-size:20px}.game{flex-direction:column;background:#07101d}.header{height:66px;display:grid;grid-template-columns:52px 1fr 70px;align-items:center;gap:12px;padding:8px 14px;background:#0b1423}.icon{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0b;color:#fff;font-size:26px}.progress-text{text-align:center;font-weight:700}.track{height:7px;background:#ffffff16;border-radius:99px;overflow:hidden;margin-top:6px}.bar{height:100%;width:0;background:#ffda36;transition:width .2s}.level{text-align:center;background:#17304e;border-radius:12px;padding:9px 4px;font-weight:800}.stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block}.focus,.count,.feedback,.instruction{position:absolute;left:50%;transform:translateX(-50%);pointer-events:none}.focus{top:46%;font-size:34px;color:#fff8}.count{top:40%;font-size:68px;font-weight:900;text-shadow:0 4px 20px #000}.feedback{top:16%;font-size:clamp(24px,5vw,44px);font-weight:900;opacity:0}.feedback.show{opacity:1}.feedback.good{color:#78f2b5}.feedback.bad{color:#ff9b9b}.instruction{bottom:16px;background:#07101dcc;border:1px solid #ffffff22;padding:8px 16px;border-radius:99px;color:#dce8f8}.answers{height:104px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0b1423}.answer{border:1px solid #ffffff20;background:#14243a;color:#fff;border-radius:16px;font-weight:900;font-size:20px}.answer:disabled{opacity:.35}.answer:not(:disabled):active{transform:scale(.98);background:#1e3b60}.score{width:180px;height:180px;border-radius:50%;border:13px solid #ffda36;display:grid;place-items:center;margin:18px 0;background:#101d30}.score strong{font-size:64px;line-height:1}.score span{display:block;color:#c8d5e8}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:10px;width:min(420px,100%);margin-bottom:18px}.result-grid div{background:#101d30;border:1px solid #ffffff12;border-radius:14px;padding:13px}.result-grid span{display:block;color:#9fb1ca;font-size:12px}.result-grid strong{font-size:20px}.best{color:#ffda36;font-weight:900;margin:0 0 14px}.portrait{position:fixed;inset:0;z-index:20;background:#07101df2;display:none;align-items:center;justify-content:center;text-align:center;padding:28px}.portrait div{background:#14243a;padding:24px;border-radius:18px}.portrait button{margin-top:16px}@media(orientation:portrait) and (max-width:719px){.game.active~.portrait{display:flex}}@media(max-height:470px){.header{height:56px}.answers{height:82px}.answer{font-size:17px}.instruction{bottom:8px}}
</style>
</head>
<body>
<section id="home" class="screen home active"><div class="brand">DODGE READ</div><h1>消えたボール</h1><p class="lead">途中で消えるボールの行き先を予測しよう。</p><div class="ball-logo"></div><button id="start" class="primary">トレーニング開始</button><div class="stats"><div><span>ベスト</span><strong id="best">-- / 15</strong></div><div><span>プレイ回数</span><strong id="sessions">0回</strong></div></div></section>
<section id="game" class="screen game"><header class="header"><button id="quit" class="icon">×</button><div><div class="progress-text"><span id="number">1</span> / 15</div><div class="track"><div id="bar" class="bar"></div></div></div><div class="level">Lv.<span id="level">2</span></div></header><div class="stage"><canvas id="canvas"></canvas><div id="focus" class="focus">＋</div><div id="count" class="count"></div><div id="feedback" class="feedback"></div><div id="instruction" class="instruction">中央の＋を見よう</div></div><div class="answers"><button class="answer" data-lane="left" disabled>← 左</button><button class="answer" data-lane="center" disabled>● 中央</button><button class="answer" data-lane="right" disabled>右 →</button></div></section>
<section id="result" class="screen result"><div class="brand">TRAINING COMPLETE</div><h1>トレーニング完了</h1><div class="score"><div><strong id="score">0</strong><span>/ 15</span></div></div><p id="message" class="lead"></p><div class="result-grid"><div><span>反応時間</span><strong id="reaction">-- ms</strong></div><div><span>最高レベル</span><strong id="maxLevel">Lv.2</strong></div><div><span>左コース</span><strong id="leftRate">--%</strong></div><div><span>右コース</span><strong id="rightRate">--%</strong></div></div><div id="newBest" class="best" hidden>自己ベスト更新！</div><button id="retry" class="primary">もう一度</button><button id="homeBtn" class="secondary">ホームへ</button></section>
<div id="portrait" class="portrait"><div><strong>横向きがおすすめ</strong><p>スマホを横向きにすると遊びやすくなります。</p><button id="continue" class="secondary">このまま続ける</button></div></div>
<script>
const TOTAL=15,KEY='dodge-read-progress-v1',lanes=['left','center','right'];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const screens={home:$('#home'),game:$('#game'),result:$('#result')},canvas=$('#canvas'),ctx=canvas.getContext('2d');
let session=null,state=null,raf=0,w=0,h=0,portraitDismissed=false;
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function difficulty(level){level=clamp(Math.round(level),1,10);return{level,visible:1040-(level-1)*55,total:1760-(level-1)*45,spread:.09+(level-1)*.006,curve:level>=5?(level-4)*.006:0}}
function trial(level){const d=difficulty(level),lane=lanes[Math.floor(Math.random()*3)],c=lane==='left'?.26:lane==='right'?.74:.5;return{id:Math.random(),lane,level:d.level,startX:.5+(Math.random()-.5)*.06,targetX:clamp(c+(Math.random()-.5)*d.spread,lane==='left'?.13:lane==='center'?.39:.64,lane==='left'?.36:lane==='center'?.61:.87),curve:d.curve*(Math.random()<.5?-1:1)*(.35+Math.random()*.65),visible:d.visible,total:d.total}}
function position(t,p){p=clamp(p,0,1);const z=1-Math.pow(1-p,1.55);return{x:clamp(t.startX+(t.targetX-t.startX)*z+Math.sin(Math.PI*p)*t.curve,.04,.96),y:.22+.62*Math.pow(p,1.34),scale:.28+1.5*Math.pow(p,1.7)}}
function show(name){Object.entries(screens).forEach(([k,n])=>n.classList.toggle('active',k===name));if(name!=='game')cancelAnimationFrame(raf);refreshPortrait()}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{best:0,sessions:0}}catch{return{best:0,sessions:0}}}
function refreshStats(){const p=load();$('#best').textContent=p.sessions?`${p.best} / 15`:'-- / 15';$('#sessions').textContent=`${p.sessions||0}回`}
function save(score){const p=load(),isBest=score>(p.best||0),n={best:Math.max(p.best||0,score),sessions:(p.sessions||0)+1};localStorage.setItem(KEY,JSON.stringify(n));return isBest}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function court(){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#132642');g.addColorStop(.45,'#0d1d34');g.addColorStop(1,'#09111f');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const hy=h*.2;ctx.strokeStyle='rgba(180,206,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w*.48,hy);ctx.lineTo(w*.08,h);ctx.moveTo(w*.52,hy);ctx.lineTo(w*.92,h);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.12)';for(let i=1;i<=6;i++){const p=i/7,y=hy+Math.pow(p,1.6)*(h-hy),half=18+Math.pow(p,1.4)*w*.42;ctx.beginPath();ctx.moveTo(w/2-half,y);ctx.lineTo(w/2+half,y);ctx.stroke()}ctx.setLineDash([9,11]);ctx.strokeStyle='rgba(255,219,61,.35)';ctx.beginPath();ctx.moveTo(w/2,hy);ctx.lineTo(w/2,h);ctx.stroke();ctx.setLineDash([])}
function ball(pos,a=1,ghost=false){const x=pos.x*w,y=pos.y*h,r=Math.max(7,Math.min(w,h)*.044*pos.scale);ctx.save();ctx.globalAlpha=a;const s=ctx.createRadialGradient(x,y+r*1.2,0,x,y+r*1.2,r*1.5);s.addColorStop(0,'#0007');s.addColorStop(1,'#0000');ctx.fillStyle=s;ctx.beginPath();ctx.ellipse(x,y+r*1.2,r*1.5,r*.42,0,0,Math.PI*2);ctx.fill();const g=ctx.createRadialGradient(x-r*.34,y-r*.38,r*.12,x,y,r);g.addColorStop(0,ghost?'#e9f6ff':'#fff7a4');g.addColorStop(.5,ghost?'#7fd4ff':'#ffdd3d');g.addColorStop(1,ghost?'#176ea3':'#e57800');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle=ghost?'#0c4a6eaa':'#5b2a0088';ctx.lineWidth=Math.max(1.2,r*.07);ctx.beginPath();ctx.arc(x,y,r*.72,-.8,1.15);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*.68,2,4.25);ctx.stroke();ctx.restore()}
function marker(t){ctx.save();ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(t.targetX*w,h*.86,25,0,Math.PI*2);ctx.stroke();ctx.restore()}
function draw(now=performance.now()){if(!w||!h)return;court();if(state){const t=state.t;if(state.phase==='flying'){const e=now-state.started,p=Math.min(1,e/t.total);if(e<=t.visible)ball(position(t,p))}else if(state.phase==='revealing'){const e=now-state.revealStart,d=720,sp=t.visible/t.total,rp=Math.min(1,e/d),p=sp+(1-sp)*rp;for(let i=5;i>=1;i--)ball(position(t,Math.max(sp,p-i*.028)),.08+(5-i)*.035,true);ball(position(t,p),.92,true);if(rp>.72)marker(t);if(e>=d&&!state.done){state.done=true;setTimeout(next,520)}}}if($('#game').classList.contains('active'))raf=requestAnimationFrame(draw)}
function enable(v){$$('.answer').forEach(b=>b.disabled=!v)}
function header(){$('#number').textContent=Math.min(session.index+1,TOTAL);$('#bar').style.width=`${session.index/TOTAL*100}%`;$('#level').textContent=session.level}
async function countdown(){for(const x of ['3','2','1']){$('#count').textContent=x;await new Promise(r=>setTimeout(r,420))}$('#count').textContent=''}
async function start(){cancelAnimationFrame(raf);session={index:0,level:2,results:[],recent:[]};state=null;portraitDismissed=false;show('game');requestAnimationFrame(()=>{resize();header()});enable(false);$('#feedback').className='feedback';$('#instruction').textContent='中央の＋を見よう';$('#focus').style.opacity='1';await countdown();launch()}
function launch(){if(!session||session.index>=TOTAL)return finish();header();enable(false);$('#feedback').className='feedback';$('#feedback').textContent='';$('#instruction').textContent='ボールを見よう';$('#focus').style.opacity='.65';const t=trial(session.level);state={t,phase:'flying',started:performance.now(),answerOpened:0,revealStart:0,done:false};cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);setTimeout(()=>{if(!state||state.t.id!==t.id||state.phase!=='flying')return;state.phase='answering';state.answerOpened=performance.now();$('#instruction').textContent='どこに来る？';$('#focus').style.opacity='0';enable(true)},t.visible)}
function label(l){return l==='left'?'左':l==='right'?'右':'中央'}
function answer(l){if(!state||state.phase!=='answering')return;enable(false);const ms=Math.round(performance.now()-state.answerOpened),correct=l===state.t.lane,f=$('#feedback');f.textContent=correct?'正解！':`正解は${label(state.t.lane)}`;f.className=`feedback show ${correct?'good':'bad'}`;$('#instruction').textContent='消えた後の軌道';session.results.push({lane:state.t.lane,correct,ms,level:state.t.level});session.recent.push(correct);session.recent=session.recent.slice(-5);if(session.recent.length>=5){const c=session.recent.filter(Boolean).length;if(c>=4)session.level=clamp(session.level+1,1,10);else if(c<=2)session.level=clamp(session.level-1,1,10)}state.phase='revealing';state.revealStart=performance.now()}
function next(){if(!session)return;session.index++;session.index>=TOTAL?finish():launch()}
function median(a){if(!a.length)return 0;a=[...a].sort((x,y)=>x-y);const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function rate(l){const a=session.results.filter(x=>x.lane===l);return a.length?Math.round(a.filter(x=>x.correct).length/a.length*100):null}
function finish(){cancelAnimationFrame(raf);enable(false);const correct=session.results.filter(x=>x.correct).length,ms=Math.round(median(session.results.map(x=>x.ms))),max=Math.max(...session.results.map(x=>x.level)),isBest=save(correct);$('#score').textContent=correct;$('#reaction').textContent=`${ms} ms`;$('#maxLevel').textContent=`Lv.${max}`;const lr=rate('left'),rr=rate('right');$('#leftRate').textContent=lr===null?'--%':`${lr}%`;$('#rightRate').textContent=rr===null?'--%':`${rr}%`;$('#message').textContent=correct>=14?'すごい！軌道をかなり正確に読めています。':correct>=11?'よく見えています。次は、より早く消えるボールへ。':correct>=8?'いい練習になりました。焦らず最初の動きを見よう。':'伸びしろたっぷり。ボールの速さと向きを最後まで見よう。';$('#newBest').hidden=!isBest;state=null;show('result');refreshStats()}
function home(){cancelAnimationFrame(raf);session=null;state=null;enable(false);show('home');refreshStats()}
function refreshPortrait(){const p=innerHeight>innerWidth&&innerWidth<720&&!portraitDismissed&&$('#game').classList.contains('active');$('#portrait').style.display=p?'flex':'none'}
$('#start').onclick=start;$('#retry').onclick=start;$('#homeBtn').onclick=home;$('#quit').onclick=()=>{if(confirm('トレーニングをやめますか？'))home()};$('#continue').onclick=()=>{portraitDismissed=true;refreshPortrait()};$$('.answer').forEach(b=>b.onclick=()=>answer(b.dataset.lane));addEventListener('resize',()=>{refreshPortrait();if($('#game').classList.contains('active'))resize()});addEventListener('orientationchange',()=>setTimeout(()=>{portraitDismissed=false;refreshPortrait();resize()},200));refreshStats();
</script>
</body>
</html>
